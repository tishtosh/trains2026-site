<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Item — Train Collection Catalog</title>
<link rel="stylesheet" href="style.css?v=228f3012ac">
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b75d4ede3a044fe483a4d74fb32a657b"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>
<div id="site-gate">
  <form class="gate-box" id="site-gate-form" autocomplete="off">
    <h2>This catalog is private</h2>
    <input type="password" id="site-gate-input" placeholder="Password" autofocus>
    <button type="submit">Enter</button>
    <p class="gate-error" id="site-gate-error"></p>
  </form>
</div>
<script>
(function () {
  var HASH = "9b59e3bc5d62d69b201e93eb8c491a567fc46533ca873e673131e1d236ebf544";
  var STORE_KEY = "trainCatalogAuthed";
  var storage = null;
  try { storage = window.sessionStorage; } catch (e) { storage = null; }

  var already = false;
  try { already = !!storage && storage.getItem(STORE_KEY) === '1'; } catch (e) {}

  function unlock() {
    document.body.classList.remove('gate-locked');
    var gate = document.getElementById('site-gate');
    if (gate) gate.classList.add('hidden');
    document.dispatchEvent(new Event('site-authed'));
  }

  if (already) {
    unlock();
  } else {
    document.body.classList.add('gate-locked');
  }

  function sha256Hex(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (already) return;
    var form = document.getElementById('site-gate-form');
    var input = document.getElementById('site-gate-input');
    var error = document.getElementById('site-gate-error');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!window.crypto || !window.crypto.subtle) {
        error.textContent = "This browser can't check the password here (needs https or localhost).";
        return;
      }
      sha256Hex(input.value).then(function (hex) {
        if (hex === HASH) {
          try { storage && storage.setItem(STORE_KEY, '1'); } catch (e) {}
          unlock();
        } else {
          error.textContent = 'Wrong password.';
          input.value = '';
          input.focus();
        }
      });
    });
  });
})();
</script>

<div id="item-root">
<header class="item-header">
  <div class="eyebrow" aria-label="Private Collection, Catalog, Item">
    <span>Private Collection</span><span class="eyebrow-sep" aria-hidden="true">/</span><a href="index.html">Catalog</a><span class="eyebrow-sep" aria-hidden="true">/</span><span id="item-breadcrumb-name"></span>
    <nav class="item-nav" aria-label="Browse catalog items">
      <a id="item-prev" href="#" aria-label="Previous item" title="Previous item">&lsaquo;</a>
      <a id="item-next" href="#" aria-label="Next item" title="Next item">&rsaquo;</a>
    </nav>
  </div>
  <h1 id="item-title"></h1>
</header>
<p class="item-no-detail" id="item-no"></p>
<span class="badge" id="item-badge"></span>
<div class="item-photos" id="item-photos"></div>
<dl id="item-dl"></dl>
<div class="value" id="item-value" style="display:none"><strong>Value commentary</strong><p></p></div>
<div class="notes" id="item-notes" style="display:none"><strong>Identification notes</strong><p></p></div>
<footer><a href="disclaimer.html">Disclaimer</a></footer>
</div>

<div class="lightbox-overlay" id="lightbox">
  <button type="button" class="lightbox-nav prev" aria-label="Previous photo">&larr;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button type="button" class="lightbox-nav next" aria-label="Next photo">&rarr;</button>
  <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
</div>

<script>
(function () {
  function render() {
    var id = new URLSearchParams(location.search).get('id');
    fetch('data/catalog.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (items) {
      var item = items.filter(function (it) { return it.id === id; })[0];
      var root = document.getElementById('item-root');
      if (!item) {
        root.innerHTML = '';
        var msg = document.createElement('p');
        msg.className = 'item-not-found';
        msg.textContent = 'Item not found.';
        root.appendChild(msg);
        return;
      }

      document.title = item.name;
      document.getElementById('item-title').textContent = item.name;
      document.getElementById('item-breadcrumb-name').textContent = item.name;
      var orderedItems = items.slice().sort(function (a, b) {
        return (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' });
      });
      var itemIndex = orderedItems.findIndex(function (it) { return it.id === item.id; });
      var previousItem = orderedItems[(itemIndex - 1 + orderedItems.length) % orderedItems.length];
      var nextItem = orderedItems[(itemIndex + 1) % orderedItems.length];
      var previousLink = document.getElementById('item-prev');
      var nextLink = document.getElementById('item-next');
      previousLink.href = 'item.html?id=' + encodeURIComponent(previousItem.id);
      previousLink.setAttribute('aria-label', 'Previous item: ' + previousItem.name);
      previousLink.title = previousItem.name;
      nextLink.href = 'item.html?id=' + encodeURIComponent(nextItem.id);
      nextLink.setAttribute('aria-label', 'Next item: ' + nextItem.name);
      nextLink.title = nextItem.name;
      document.getElementById('item-no').textContent = 'Item #' + item.number;
      var badge = document.getElementById('item-badge');
      badge.textContent = item.status_label;
      badge.className = 'badge ' + item.status_css;

      var dl = document.getElementById('item-dl');
      dl.innerHTML = '';
      item.rows.forEach(function (row) {
        var dt = document.createElement('dt'); dt.textContent = row[0];
        var dd = document.createElement('dd'); dd.textContent = row[1];
        dl.appendChild(dt); dl.appendChild(dd);
      });

      var photosEl = document.getElementById('item-photos');
      photosEl.innerHTML = '';
      var thumbs = [];
      item.photos.forEach(function (p) {
        var img = document.createElement('img');
        img.src = p.thumb; img.dataset.full = p.full; img.alt = p.alt;
        photosEl.appendChild(img);
        thumbs.push(img);
      });

      var valueEl = document.getElementById('item-value');
      if (item.value_commentary) {
        valueEl.querySelector('p').textContent = item.value_commentary;
        valueEl.style.display = '';
      }
      var notesEl = document.getElementById('item-notes');
      if (item.notes) {
        notesEl.querySelector('p').textContent = item.notes;
        notesEl.style.display = '';
      }

      // Cosmetic per-item URL, added 2026-08-23, purely so Cloudflare Web
      // Analytics (which strips query strings and has no custom-event
      // API) can tell which item was viewed -- otherwise every item shows
      // up identically as "item.html". No file exists at this path; if
      // reloaded or bookmarked/shared directly, site/404.html (copied to
      // the published mirror's root by publish_site.sh) bounces it back
      // to this real item.html?id=... . Every relative link/URL already
      // on the page (built above, or already in the static shell) must be
      // frozen to its fully-RESOLVED absolute form first: replaceState
      // changes what "relative" resolves against for everything on the
      // page, not just things set after this point -- most importantly
      // each photo's data-full (e.g. "../photos/by-item/..."), read later
      // by the lightbox on click, well after the rewrite; left relative,
      // it would silently 404 one directory too deep instead of opening.
      document.querySelectorAll('a[href]').forEach(function (a) { a.href = a.href; });
      thumbs.forEach(function (img) {
        img.src = img.src;
        if (img.dataset.full) {
          img.dataset.full = new URL(img.dataset.full, location.href).href;
        }
      });
      if (window.history && history.replaceState) {
        history.replaceState(null, '', 'item/' + item.id);
      }

      // --- lightbox, wired up now that the photo <img> tags actually exist ---
      var overlay = document.getElementById('lightbox');
      if (!thumbs.length || !overlay) return;
      var lbImg = document.getElementById('lightbox-img');
      var prevBtn = overlay.querySelector('.lightbox-nav.prev');
      var nextBtn = overlay.querySelector('.lightbox-nav.next');
      var closeBtn = overlay.querySelector('.lightbox-close');
      var current = 0;
      function show(i) {
        current = (i + thumbs.length) % thumbs.length;
        lbImg.src = thumbs[current].dataset.full || thumbs[current].src;
        lbImg.alt = thumbs[current].alt;
      }
      function openAt(i) { show(i); overlay.classList.add('open'); }
      function close() { overlay.classList.remove('open'); }
      thumbs.forEach(function (img, i) { img.addEventListener('click', function () { openAt(i); }); });
      prevBtn.addEventListener('click', function () { show(current - 1); });
      nextBtn.addEventListener('click', function () { show(current + 1); });
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', function (e) {
        if (!overlay.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });
    });
  }

  if (document.body.classList.contains('gate-locked')) {
    document.addEventListener('site-authed', render, { once: true });
  } else {
    document.addEventListener('DOMContentLoaded', render);
  }
})();
</script>
</body>
</html>
